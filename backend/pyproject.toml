[project]
name = "cfdc-backend"
version = "0.1.0"
description = "API de l'application de gestion du CFDC (AAN)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: test qui a besoin d'une vraie base PostgreSQL (DATABASE_URL)"]
