[project]
name = "{{SERVICE_NAME}}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2",
    "structlog>=25.1",
    # Ajoutez ici les dépendances propres au service (par exemple
    # "pyjwt>=2.13" si ce service émet ou valide des JWT) — consultez le
    # tableau de pile technique de son propre CLAUDE.md.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
