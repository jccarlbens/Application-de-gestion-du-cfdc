# Serveur de TEST du CFDC sur Render, plan gratuit (affinage de US-001).
# DONNÉES FICTIVES SEULEMENT : aucun vrai participant, NIF ou CIN n'y entre.
# La base PostgreSQL est sur Neon (la base gratuite de Render expire après 30 jours).
# Les mêmes Dockerfile servent à Docker Compose et aux serveurs de l'AAN (ADR 3).
services:
  - type: web
    name: cfdc-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false # secret : l'adresse fournie par Neon, saisie dans le tableau de bord de Render
      - key: ENVIRONMENT
        value: test
      - key: LOG_LEVEL
        value: INFO
      # Les liens envoyés par email mènent à l'interface du serveur de test.
      - key: APP_BASE_URL
        value: https://cfdc-frontend.onrender.com
      # Emails par Brevo (US-002, décision 10). Les identifiants SMTP sont
      # saisis dans le tableau de bord de Render, jamais ici.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false # l'identifiant SMTP de Brevo
      - key: SMTP_PASSWORD
        sync: false # secret : la clé SMTP de Brevo
      - key: EMAIL_SENDER
        sync: false # une adresse d'expéditeur vérifiée dans Brevo, par exemple « CFDC <adresse@…> »

  - type: web
    name: cfdc-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeployTrigger: commit
    envVars:
      # L'adresse publique du backend ci-dessus. Si Render lui a donné une autre
      # adresse (nom déjà pris), corrigez-la ici et dans le tableau de bord.
      - key: BACKEND_URL
        value: https://cfdc-backend.onrender.com
